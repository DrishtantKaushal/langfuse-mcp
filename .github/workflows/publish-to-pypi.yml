name: Publish to PyPI

# Triggers:
# - pushing a tag matching v* (e.g. v0.1.0) builds and publishes to PyPI
# - manual dispatch for one-off rebuilds from the Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build distribution
        run: python -m build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI (Trusted Publishing via OIDC)
    needs: build
    runs-on: ubuntu-latest

    # Must match the environment name registered as a trusted publisher on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/langfuse-mcp-server/

    # id-token: write is required for PyPI OIDC — no API token needs to be
    # stored in GitHub secrets.
    permissions:
      id-token: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
